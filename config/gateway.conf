server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript text/xml application/xml;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Dashboard (Frontend) under /studio
    location = /studio {
        return 301 /studio/;
    }

    location /studio/ {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SeaweedFS S3 public object proxy (immutable UUID assets cached 30 days)
    location /storage/ {
        proxy_pass http://seaweedfs:8333/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Landing page is hosted on Vercel; redirect origin root to /studio/
    location / {
        return 302 /studio/;
    }
}
