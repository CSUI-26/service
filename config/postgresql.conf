# PostgreSQL is reachable only over the zenith-backend internal Docker network.
# Tuned for ~600 passive users on a small VPS container (384m mem_limit).

listen_addresses = '*'
port = 5432
password_encryption = 'scram-sha-256'
ssl = off

hba_file = '/var/lib/postgresql/config/pg_hba.conf'

max_connections = 50
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB

log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %u@%d %r '
